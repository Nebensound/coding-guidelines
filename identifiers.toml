# Register of retired identifiers.
#
# Every heading that states a citable rule carries an identifier that never
# changes. When the rule moves to another place or is dropped, its identifier
# is entered here, so that a citation of it still leads somewhere. Active
# identifiers are not listed; they are found in the pages.
#
# An entry is a table named after the retired identifier, in one of two forms.
#
# The rule lives on under another identifier:
#
#   [old-identifier]
#   moved-to = "new-identifier"
#
# The rule was dropped; the version is the release of the guidelines that no
# longer contains it:
#
#   [dropped-identifier]
#   removed-since = "1.0.0"
#   reason = "Why the rule was dropped."
