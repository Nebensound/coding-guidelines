# Register of retired identifiers.
#
# Every heading that states a citable rule carries an identifier that never
# changes. When the rule is merged into another one or dropped, its identifier
# is entered here, so that a citation of it still leads somewhere. A retired
# identifier is never given to another rule. Active identifiers are not listed;
# they are found in the pages, so a free identifier appears in neither the pages
# nor this register.
#
# An entry is a table named after the retired identifier, in one of two forms.
#
# A rule that only moves to another page keeps its identifier and is not
# entered. An entry is for a rule whose text lives on under another identifier,
# for example after two rules were merged:
#
#   [old-identifier]
#   moved-to = "new-identifier"
#
# The rule was dropped. The value of last-version is the last version of the
# guidelines in which the rule stood (X.Y.Z):
#
#   [dropped-identifier]
#   last-version = "1.2.0"
#   reason = "Why the rule was dropped."
